<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historia · Semana 04 DE — Perú: siglo XIX e inicios del XX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F4F1;
  --sheet:#FFFFFF;
  --ink:#000000;
  --ink2:#4A504E;
  --hair:#C9CCC6;
  --mark:#C8102E;
  --graph:#23282B;
  --soft:#E7EAE3;
  --ok:#1E6B3A;
  --sans:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14171A; --sheet:#1B1F22; --ink:#F2F3EF; --ink2:#A7AFAC;
    --hair:#3A4145; --mark:#FF6B6B; --graph:#F2F3EF; --soft:#252B2E;
  }
}
:root[data-theme="dark"]{
  --paper:#14171A; --sheet:#1B1F22; --ink:#F2F3EF; --ink2:#A7AFAC;
  --hair:#3A4145; --mark:#FF6B6B; --graph:#F2F3EF; --soft:#252B2E;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans);
  display:grid; place-items:center; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#viewport{position:relative;width:100vw;height:100vh;display:grid;place-items:center}
#stage{
  width:1280px;height:720px;position:relative;
  background:var(--sheet);
  box-shadow:0 0 0 1px var(--hair), 0 18px 60px rgba(0,0,0,.18);
  overflow:hidden;
}
.slide{position:absolute;inset:0;display:none;flex-direction:column}
.slide.on{display:flex}

/* ---------- head band ---------- */
.band{
  display:flex;align-items:stretch;border-bottom:2px solid var(--ink);
  flex:0 0 auto;
}
.band .num{
  width:112px;flex:0 0 112px;background:var(--ink);color:var(--sheet);
  display:flex;align-items:center;justify-content:center;
  font-size:42px;font-weight:800;letter-spacing:-.02em;
}
.band .num.theory{background:var(--mark)}
.band .meta{flex:1;display:flex;flex-direction:column;justify-content:center;padding:12px 26px;gap:2px}
.band .bloque{font-size:13.5px;font-weight:600;color:var(--ink2);letter-spacing:.01em}
.band .titulo{font-size:27px;font-weight:700;line-height:1.12;letter-spacing:-.015em}
.band .brand{
  flex:0 0 auto;display:flex;align-items:center;padding:0 24px;border-left:1px solid var(--hair);
  font-size:12.5px;font-weight:600;color:var(--ink2);text-align:right;line-height:1.3;max-width:190px
}

/* ---------- body ---------- */
.body{flex:1 1 auto;min-height:0;overflow:hidden;padding:20px 28px 16px}
.fitwrap{transform-origin:top left;min-height:100%;display:flex;flex-direction:column}

.qgrid{display:grid;grid-template-columns:465px 1fr;gap:0;flex:1 1 auto}
.qleft{padding-right:26px;border-right:2px solid var(--ink)}
.qright{padding-left:26px}

.enun{font-family:var(--serif);font-size:18.5px;line-height:1.45;margin-bottom:14px}
.enun em{font-style:italic}
.alts{list-style:none;display:flex;flex-direction:column;gap:7px}
.alt{display:flex;gap:10px;align-items:flex-start;font-size:16px;line-height:1.32;padding:4px 6px;border-radius:3px}
.bub{
  flex:0 0 auto;width:25px;height:25px;border-radius:50%;border:2px solid var(--ink);
  display:grid;place-items:center;font-size:13.5px;font-weight:700;margin-top:-1px;
  transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease;
}
.revealed .alt.hit{background:var(--soft)}
.revealed .alt.hit .bub{background:var(--mark);border-color:var(--mark);color:#fff;transform:scale(1.12)}
.revealed .alt.hit .txt{font-weight:600}

.clavebox{
  display:flex;align-items:center;gap:12px;border:2px solid var(--mark);
  padding:8px 14px;margin-bottom:12px
}
.clavebox .lab{font-size:15px;font-weight:600;color:var(--ink2)}
.clavebox .let{
  width:34px;height:34px;border-radius:50%;background:var(--mark);color:#fff;
  display:grid;place-items:center;font-size:19px;font-weight:800
}
.clavebox .why{font-size:15px;font-weight:600;line-height:1.25}

h4.sec{font-size:14px;font-weight:700;margin:12px 0 6px;padding-bottom:3px;border-bottom:1px solid var(--hair)}
h4.sec:first-child{margin-top:0}

.tbl{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.3}
.tbl th{
  background:var(--graph);color:var(--sheet);text-align:left;
  padding:5px 9px;font-size:13px;font-weight:600
}
.tbl td{padding:5px 9px;border-bottom:1px solid var(--hair);vertical-align:top}
.tbl td.k{font-weight:600;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl.wide td.k{white-space:normal}
.tbl.mini{font-size:13.5px}
.tbl.mini th,.tbl.mini td{padding:4px 7px}

.v{display:inline-block;min-width:17px;text-align:center;font-weight:800;color:var(--ok)}
.f{display:inline-block;min-width:17px;text-align:center;font-weight:800;color:var(--mark)}
b.hl{background:linear-gradient(transparent 62%, rgba(200,16,46,.28) 62%);font-weight:700}

.nota{
  margin-top:10px;font-size:14px;line-height:1.35;padding:8px 11px;background:var(--soft);
  border-left:3px solid var(--mark)
}
.nota b{font-weight:700}

.reveal{opacity:0;transform:translateY(6px);transition:opacity .22s ease,transform .22s ease}
.revealed .reveal{opacity:1;transform:none}
.hintrev{
  position:absolute;right:30px;bottom:44px;font-size:13px;color:var(--ink2);
  border:1px dashed var(--hair);padding:5px 10px
}
.revealed .hintrev{display:none}

/* ---------- theory layouts ---------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;align-items:start}
.two>div,.three>div{display:flex;flex-direction:column}
.fitwrap>*+*{margin-top:0}
.stack{display:flex;flex-direction:column;gap:12px}
.lead{font-family:var(--serif);font-size:17.5px;line-height:1.45;margin-bottom:12px}

/* ---------- cover ---------- */
.cover{padding:0}
.cover .top{flex:1 1 auto}
.cover .top{padding:60px 70px 0;display:flex;flex-direction:column;justify-content:center}
.kicker{font-size:17px;font-weight:600;color:var(--ink2);margin-bottom:14px}
.cover h1{font-size:74px;font-weight:800;line-height:.98;letter-spacing:-.03em;max-width:15ch}
.cover h1 span{display:block}
.rulebig{height:8px;background:var(--mark);width:220px;margin:26px 0 22px}
.cover .sub{font-size:20px;line-height:1.45;max-width:58ch;font-family:var(--serif)}
.cover .bot{border-top:2px solid var(--ink);display:flex;justify-content:space-between;align-items:center;padding:16px 70px;font-size:14.5px;font-weight:600;color:var(--ink2)}
.keysgrid{display:grid;grid-template-columns:repeat(13,1fr);gap:6px}
.keycell{border:1.5px solid var(--ink);display:flex;flex-direction:column;align-items:center;padding:5px 0}
.keycell .n{font-size:12px;color:var(--ink2);font-weight:600}
.keycell .a{font-size:21px;font-weight:800;color:var(--mark)}

/* ---------- chrome ---------- */
#bar{
  position:fixed;left:0;right:0;bottom:0;height:40px;display:flex;align-items:center;gap:10px;
  padding:0 14px;background:var(--paper);
  border-top:1px solid var(--hair);font-size:13px;z-index:20
}
#bar button{
  font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink);
  background:transparent;border:1px solid var(--hair);padding:5px 10px;cursor:pointer
}
#bar button:hover{background:var(--soft)}
#bar button:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
#count{font-weight:700;min-width:70px}
#prog{position:fixed;top:0;left:0;height:3px;background:var(--mark);z-index:30;transition:width .2s ease}
#idx{
  position:fixed;inset:0;background:var(--paper);z-index:40;display:none;
  padding:26px 30px 60px;overflow:auto
}
#idx.on{display:block}
#idx h3{font-size:20px;margin-bottom:14px}
#idxlist{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#idxlist button{
  text-align:left;font-family:var(--sans);font-size:13px;line-height:1.25;padding:8px 10px;
  border:1px solid var(--hair);background:var(--sheet);color:var(--ink);cursor:pointer
}
#idxlist button:hover{border-color:var(--mark)}
#idxlist button b{display:block;font-size:11px;color:var(--mark);margin-bottom:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:700px){#bar{font-size:12px}}
</style>
</head>
<body>
<div id="prog"></div>
<div id="viewport"><div id="stage"></div></div>
<div id="bar">
  <button id="prev">&larr; Anterior</button>
  <button id="next">Siguiente &rarr;</button>
  <span id="count">1 / 1</span>
  <button id="revall">Mostrar todas las claves</button>
  <button id="openidx">Índice</button>
  <button id="fs">Pantalla completa</button>
  <span style="margin-left:auto;color:var(--ink2)">Espacio o &rarr;: avanza y revela · V: claves · I: índice</span>
</div>
<div id="idx"><h3>Índice de la sesión</h3><div id="idxlist"></div></div>

<script>
/* ============================================================
   HELPERS
   ============================================================ */

  var b = rows.map(function(r){
    return '<tr>'+r.map(function(c,i){return '<td'+(i===0?' class="k"':'')+'>'+c+'</td>'}).join('')+'</tr>';
  }).join('');
  return '<table class="tbl '+(cls||'')+'">'+h+'<tbody>'+b+'</tbody></table>';
}
function S(t){return '<h4 class="sec">'+t+'</h4>'}
function N(t){return '<div class="nota">'+t+'</div>'}

   CONTENIDO
   ============================================================ */

  var tcells='';
  for(var j=0;j<tarea.length;j++){
    tcells+='<div class="keycell"><span class="n">'+(j+1)+'</span><span class="a" style="color:var(--ink)">'+tarea[j]+'</span></div>';
  }
  return '<div class="slide" data-grow="1">'+
    '<div class="band"><div class="num theory">&#10003;</div><div class="meta"><div class="bloque">Cierre</div>'+
    '<div class="titulo">Claves y ruta de repaso</div></div><div class="brand">ADUNI<br>Semana 03</div></div>'+
    '<div class="body"><div class="fitwrap">'+
      '<h4 class="sec">Práctica dirigida</h4><div class="keysgrid">'+cells+'</div>'+
      '<h4 class="sec">Tarea domiciliaria (claves del folleto)</h4><div class="keysgrid">'+tcells+'</div>'+
      N('Las claves impresas en el folleto corresponden a la <b>tarea domiciliaria</b>, no a la práctica dirigida.')+
      '<h4 class="sec">Tres ideas que deben quedar</h4>'+
      T(null,[
        ['Europa medieval','El poder se sostiene en la alianza entre fuerza militar y legitimidad religiosa: papado y francos, señor y vasallo, orden divino y estamentos.'],
        ['Virreinato','Toda institución colonial existe para lo mismo: extraer tributo y trabajo indígena y trasladar la plata a la metrópoli.'],
        ['Borbones','Más impuestos y más control peninsular producen el efecto contrario al buscado: rebeliones indígenas y resentimiento criollo.']
      ],'wide')+
    '</div></div></div>';
}

function renderTheory(s){
  return '<div class="slide" data-grow="1">'+
    '<div class="band"><div class="num theory">&#9632;</div><div class="meta"><div class="bloque">'+s.bloque+'</div>'+
    '<div class="titulo">'+s.titulo+'</div></div><div class="brand">Teoría de apoyo</div></div>'+
    '<div class="body"><div class="fitwrap">'+s.html+'</div></div></div>';
}

function renderQ(s){
  var alts='';
  for(var i=0;i<s.alts.length;i++){
    alts+='<li class="alt'+(i===s.clave?' hit':'')+'"><span class="bub">'+LETTERS[i]+'</span><span class="txt">'+s.alts[i]+'</span></li>';
  }
  return '<div class="slide">'+
    '<div class="band"><div class="num">'+s.n+'</div><div class="meta"><div class="bloque">'+s.bloque+'</div>'+
    '<div class="titulo">'+s.titulo+'</div></div><div class="brand">Práctica dirigida<br>Pregunta '+s.n+' de 25</div></div>'+
    '<div class="body"><div class="fitwrap"><div class="qgrid">'+
      '<div class="qleft"><p class="enun">'+s.enun+'</p><ul class="alts">'+alts+'</ul></div>'+
      '<div class="qright"><div class="reveal">'+
        '<div class="clavebox"><span class="let">'+LETTERS[s.clave]+'</span><span class="why">'+s.why+'</span></div>'+
        s.an+
      '</div></div>'+
    '</div></div></div>'+
    '<div class="hintrev">Espacio para ver la clave</div>'+
  '</div>';
}

var html='';
for(var i=0;i<SLIDES.length;i++){
  var s=SLIDES[i];
  if(s.type==='cover') html+=renderCover();
  else if(s.type==='keys') html+=renderKeys();
  else if(s.type==='t') html+=renderTheory(s);
  else html+=renderQ(s);
}
stage.innerHTML=html;
var nodes=stage.querySelectorAll('.slide');

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
var cur=0, forceReveal=false;
var count=document.getElementById('count'), prog=document.getElementById('prog');

function fit(el){
  var body=el.querySelector('.body'); if(!body) return;
  var wrap=body.querySelector('.fitwrap'); if(!wrap) return;
  var maxK=(el.getAttribute('data-grow')==='1')?1.7:1;
  var avail=body.clientHeight;
  wrap.style.transform='none'; wrap.style.minHeight='0'; wrap.style.width='100%';
  var k=1;
  for(var i=0;i<6;i++){
    var need=wrap.scrollHeight; if(!need) break;
    var kn=avail/need;
    if(kn>maxK) kn=maxK;
    if(kn<.55) kn=.55;
    if(Math.abs(kn-k)<.01){ k=kn; break; }
    k=kn;
    wrap.style.width=(100/k)+'%';
  }
  wrap.style.width=(100/k)+'%';
  wrap.style.minHeight=(avail/k)+'px';
  wrap.style.transform=(Math.abs(k-1)<.005)?'none':'scale('+k+')';
}
function show(i){
  cur=Math.max(0,Math.min(SLIDES.length-1,i));
  for(var j=0;j<nodes.length;j++) nodes[j].classList.toggle('on', j===cur);
  var el=nodes[cur];
  if(forceReveal) el.classList.add('revealed'); else el.classList.remove('revealed');
  count.textContent=(cur+1)+' / '+SLIDES.length;
  prog.style.width=((cur+1)/SLIDES.length*100)+'%';
  fit(el);
}
function hasReveal(el){return !!el.querySelector('.reveal')}
function next(){
  var el=nodes[cur];
  if(hasReveal(el) && !el.classList.contains('revealed')){ el.classList.add('revealed'); return; }
  if(cur<SLIDES.length-1) show(cur+1);
}
function prev(){ if(cur>0) show(cur-1); }

document.getElementById('next').onclick=next;
document.getElementById('prev').onclick=prev;
document.getElementById('revall').onclick=function(){
  forceReveal=!forceReveal;
  this.textContent=forceReveal?'Ocultar claves':'Mostrar todas las claves';
  show(cur);
};
document.getElementById('fs').onclick=function(){
  if(!document.fullscreenElement){ document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen(); }
  else { document.exitFullscreen&&document.exitFullscreen(); }
};

/* índice */
var idx=document.getElementById('idx'), idxlist=document.getElementById('idxlist');
var ihtml='';
for(var k=0;k<SLIDES.length;k++){
  var sl=SLIDES[k], lab, tag;
  if(sl.type==='cover'){lab='Portada';tag='Inicio'}
  else if(sl.type==='keys'){lab='Claves y cierre';tag='Cierre'}
  else if(sl.type==='t'){lab=sl.titulo;tag=sl.bloque}
  else {lab=sl.titulo;tag='Pregunta '+sl.n}
  ihtml+='<button data-i="'+k+'"><b>'+tag+'</b>'+lab+'</button>';
}
idxlist.innerHTML=ihtml;
idxlist.onclick=function(e){
  var b=e.target.closest('button'); if(!b) return;
  idx.classList.remove('on'); show(parseInt(b.dataset.i,10));
};
document.getElementById('openidx').onclick=function(){ idx.classList.toggle('on'); };

document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ idx.classList.remove('on'); return; }
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); next(); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); prev(); }
  else if(e.key==='Home'){ show(0); }
  else if(e.key==='End'){ show(SLIDES.length-1); }
  else if(e.key==='v'||e.key==='V'){ document.getElementById('revall').click(); }
  else if(e.key==='i'||e.key==='I'){ idx.classList.toggle('on'); }
  else if(e.key==='f'||e.key==='F'){ document.getElementById('fs').click(); }
});

stage.addEventListener('click', function(e){
  var r=stage.getBoundingClientRect();
  if((e.clientX-r.left)/r.width < .18) prev(); else next();
});

/* escalado del escenario */
function resize(){
  var s=Math.min((window.innerWidth-24)/1280, (window.innerHeight-64)/720);
  stage.style.transform='scale('+s+')';
  fit(nodes[cur]);
}
window.addEventListener('resize', resize);
document.fonts && document.fonts.ready.then(function(){ resize(); show(cur); });
resize(); show(0);
</script>
</body>
</html>
